<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Sales Predictor</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/foodSales.css') }}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="{{ url_for('static', filename='script/script.js')}}" defer></script>
</head>
<body>
  <!-- Navigation Bar -->
  <nav>
    <div class="nav-left">
      <a href="/home2"> 
        <img src="{{ url_for('static', filename='images/SalesConLogo.png') }}" alt="SalesCon Logo" id="nav-logo">
      </a>
    </div>
    <div class="nav-right">
      <a href="/home2">Home</a>
      <a href="/about">About</a>
      <a href="/contact">Contact Us</a>
      <a href="/profile" id="profile-button">Profile</a>
    </div>
  </nav>

  <!-- Page Content -->
  <div class="container">
    <h1>Food Sales Predictor</h1>

    <!-- Form to select day and time period -->
    <form id="predictionForm">
      <label for="day">Select Day:</label>
      <select id="day" name="day" required>
        <option value="Monday">Monday</option>
        <option value="Tuesday">Tuesday</option>
        <option value="Wednesday">Wednesday</option>
        <option value="Thursday">Thursday</option>
        <option value="Friday">Friday</option>
        <option value="Saturday">Saturday</option>
        <option value="Sunday">Sunday</option>
      </select>

      <label for="timePeriod">Select Time Period:</label>
      <select id="timePeriod" name="timePeriod" required>
        <option value="Morning">Morning</option>
        <option value="Afternoon">Afternoon</option>
        <option value="Evening">Evening</option>
      </select>

      <button type="button" id="predictBtn">Predict</button>
    </form>

    <!-- Chart Display -->
    <canvas id="predictionChart" width="800" height="550"></canvas>
    <h5>Foodies</h5>
    <!-- Food Images and Predicted Quantities -->
    <div id="foodImagesContainer" class="food-images-container">
      <!-- Dynamic content will be inserted here -->
    </div>
  </div>

  <!-- JavaScript for Chart and Prediction -->
  <script>
    let predictionChart = null;

    // Function to fetch and display predictions
    async function getPrediction(day, timePeriod) {
      try {
        const response = await fetch('/predict_model1', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ day, time_period: timePeriod })
        });

        const data = await response.json();

        if (data.error) {
          alert(`Error: ${data.error}`);
          return;
        }

        const foods = data.map(item => item.food);
        const predictions = data.map(item => item.prediction);

        const ctx = document.getElementById('predictionChart').getContext('2d');

                  if (predictionChart) {
            // Update chart labels and data
            predictionChart.data.labels = foods;
            predictionChart.data.datasets[0].data = predictions;

            // Update the dataset's label
            predictionChart.data.datasets[0].label = `Predicted Quantities for ${day} (${timePeriod})`;

            // Redraw the chart
            predictionChart.update();
          } else {
            // Create the chart if it doesn't exist
            predictionChart = new Chart(ctx, {
              type: 'bar',
              data: {
                labels: foods,
                datasets: [{
                  label: `Predicted Quantities for ${day} (${timePeriod})`,
                  data: predictions,
                  backgroundColor: [
                    'rgba(255, 99, 132, 0.2)',
                    'rgba(54, 162, 235, 0.2)',
                    'rgba(255, 206, 86, 0.2)',
                    'rgba(75, 192, 192, 0.2)',
                    'rgba(153, 102, 255, 0.2)',
                    'rgba(255, 159, 64, 0.2)'
                  ],
                  borderColor: [
                    'rgba(255, 99, 132, 1)',
                    'rgba(54, 162, 235, 1)',
                    'rgba(255, 206, 86, 1)',
                    'rgba(75, 192, 192, 1)',
                    'rgba(153, 102, 255, 1)',
                    'rgba(255, 159, 64, 1)'
                  ],
                  borderWidth: 3,
                  borderRadius: 5,
                }]
              },
              options: {
                responsive: true,
                plugins: {
                  title: {
                    display: true,
                    text: `Food Sales Prediction for ${day} (${timePeriod})`,
                    font: {
                      size: 18,
                      weight: 'bold',
                      family: 'Poppins',
                    },
                    color: '#333',
                    padding: 20,
                  },
                  legend: {
                    display: true,
                    position: 'top',
                    labels: {
                      font: {
                        size: 14,
                        family: 'Poppins',
                      },
                      color: '#333',
                      boxWidth: 20,
                    },
                  },
                  tooltip: {
                    backgroundColor: 'rgba(0, 0, 0, 0.8)',
                    titleFont: {
                      size: 14,
                      family: 'Poppins',
                    },
                    bodyFont: {
                      size: 12,
                      family: 'Poppins',
                    },
                    padding: 10,
                  },
                },
                scales: {
                  x: {
                    ticks: {
                      font: {
                        size: 14,  // Increase font size
                        family: 'Poppins',
                        weight: 'bold',  // Optionally make the text bold for better visibility
                      },
                      color: '#333',  // Dark color for better contrast
                      maxRotation: 45,  // Rotate labels to prevent overlap
                      minRotation: 45,
                    },
                    grid: {
                      display: false,
                    },
                    title: {
                      display: true,
                      text: 'Food Items',
                      font: {
                        size: 16,  // Increase title font size
                        family: 'Poppins',
                        weight: 'bold',
                      },
                      color: '#333',
                      padding: 10,
                    },
                  },
                  y: {
                    beginAtZero: true,
                    ticks: {
                      font: {
                        size: 12,
                        family: 'Poppins',
                      },
                      color: '#666',
                    },
                    grid: {
                      color: 'rgba(200, 200, 200, 0.3)',
                    },
                  },
                },
              },
            });}


        // Display food images and predicted quantities
        displayFoodImages(foods, predictions);
      } catch (error) {
        console.error("Error fetching prediction data:", error);
      }
    }


  // Passing food image mapping from Flask into JavaScript
  const foodImageMapping = {
    "Ais-Kacang": "{{ url_for('static', filename='images/icekacang.jpg') }}",
    "Bandung-Syrup": "{{ url_for('static', filename='images/BandungSyrup.jpg') }}",
    "Cendol": "{{ url_for('static', filename='images/Cendol.jpg') }}",
    "Char-Kway-Teow": "{{ url_for('static', filename='images/CharKwayTeow.jpg') }}",
    "Kari-Puff": "{{ url_for('static', filename='images/KariPuff.jpg') }}",
    "Kopi-O": "{{ url_for('static', filename='images/KopiO.jpg') }}",
    "Kuih-muih": "{{ url_for('static', filename='images/Kuihmuih.jpg') }}",
    "Laksa": "{{ url_for('static', filename='images/Laksa.jpg') }}",
    "Lemang": "{{ url_for('static', filename='images/Lemang.jpg') }}",
    "Mee-Bandung": "{{ url_for('static', filename='images/MeeBandung.jpg') }}",
    "Mee-Goreng": "{{ url_for('static', filename='images/MeeGoreng.jpg') }}",
    "Milo-Ice": "{{ url_for('static', filename='images/MiloIce.jpg') }}",
    "Nasi-Ayam": "{{ url_for('static', filename='images/NasiAyam.jpg') }}",
    "Nasi-Kerabu": "{{ url_for('static', filename='images/NasiKerabu.jpg') }}",
    "Nasi-Lemak": "{{ url_for('static', filename='images/NasiLemak.jpg') }}",
    "Pisang-Goreng": "{{ url_for('static', filename='images/PisangGoreng.jpg') }}",
    "Rendang": "{{ url_for('static', filename='images/Rendang.jpg') }}",
    "Roti-Canai": "{{ url_for('static', filename='images/RotiCanai.jpg') }}",
    "Satay": "{{ url_for('static', filename='images/Satay.jpg') }}",
    "Teh-Tarik": "{{ url_for('static', filename='images/TehTarik.jpg') }}",
  };

  function displayFoodImages(foods, predictions) {
  const container = document.getElementById('foodImagesContainer');
  container.innerHTML = ''; // Clear the container before adding new content

  // Remove duplicates from the foods array
  const uniqueFoods = [...new Set(foods)];

  uniqueFoods.forEach((food, index) => {
    // Create a div for each food item
    const foodItemDiv = document.createElement('div');
    foodItemDiv.classList.add('food-item');

    // Format the food name if needed (replace spaces with hyphens)
    const formattedFood = food.replace(/ /g, '-');
    console.log(`Food: ${food}, Image: ${foodImageMapping[formattedFood]}`);

    // Find the corresponding image file using the preloaded mapping
    const img = document.createElement('img');
    img.src = foodImageMapping[formattedFood]; // Use the formatted key to access the image
    img.alt = food;
    img.classList.add('food-image');

    // Add food name label
    const nameLabel = document.createElement('p');
    nameLabel.textContent = food; // Show the food name
    nameLabel.classList.add('food-name');

    // Add food prediction label
    const predictionLabel = document.createElement('p');
    predictionLabel.textContent = `Predicted Quantity: ${Math.round(predictions[index])}`;

    // Append image, name, and prediction to the food item div
    foodItemDiv.appendChild(img);
    foodItemDiv.appendChild(nameLabel); // Add the name below the image
    foodItemDiv.appendChild(predictionLabel);

    // Append the food item div to the container
    container.appendChild(foodItemDiv);
  });
}

    // Event listener for the 'Predict' button
    document.getElementById('predictBtn').addEventListener('click', function() {
      const day = document.getElementById('day').value;
      const timePeriod = document.getElementById('timePeriod').value;
      getPrediction(day, timePeriod);
    });

    // Initial prediction on page load (optional)
    window.onload = function() {
      const day = document.getElementById('day').value;
      const timePeriod = document.getElementById('timePeriod').value;
      getPrediction(day, timePeriod);
    };
  </script>
</body>
</html>
