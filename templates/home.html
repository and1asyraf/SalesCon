  <!-- Rating Modal -->
<div id="rating-modal" class="modal">
  <div class="modal-content">
    <h2>Rate Hygiene</h2>
    <form id="rating-form" class="modal-form">
      <div class="form-group">
        <label for="rating" class="form-label">Your Rating:</label>
        <input 
          type="number" 
          id="rating" 
          min="1" 
          max="5" 
          placeholder="Rate between 1 to 5"
          required 
          class="form-input">
      </div>

      <div class="form-group">
        <label for="feedback" class="form-label">Your Feedback:</label>
        <textarea 
          id="feedback" 
          rows="4" 
          placeholder="Share your thoughts about the event..." 
          class="form-textarea"></textarea>
      </div>

      <div class="modal-actions">
        <button type="submit" class="btn primary-btn">Submit Rating</button>
        <button id="close-rating-modal" type="button" class="btn secondary-btn">Cancel</button>
      </div>
    </form>
  </div>
</div>

<!-- QR Modal -->
<div id="qr-modal" class="modal">
  <div class="modal-content">
    <h2>Booking Confirmation</h2>
    <p class="modal-message">Thank you for your booking! Please save or scan the QR code below for confirmation:</p>
    <div id="qrcode" class="qrcode-container"></div>
    <div class="modal-actions">
      <button id="close-modal2" class="btn primary-btn">Close</button>
    </div>
  </div>
</div>
